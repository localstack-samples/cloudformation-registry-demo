Resources:
  Topic:
    Type: AWS::SNS::Topic

  Subscriber:
    Type: LocalStack::Testing::Resource
    Properties:
      TopicArn: !Ref Topic

Outputs:
  TopicArn:
    Value: !Ref Topic

  QueueUrl:
    Value: !GetAtt Subscriber.QueueUrl

  SubscriptionArn:
    Value: !GetAtt Subscriber.SubscriptionArn
