name: Deploy on LocalStack

on:
  push:
    paths-ignore:
      - 'README.md'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  extension:
    name: Register the extension and deploy a stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The handler unit tests build SDK clients, which need a region
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lstk
        run: |
          npm install -g @localstack/lstk
          lstk setup aws --force --non-interactive

      - name: Install the CloudFormation CLI
        run: make install

      - name: Build the extension
        run: make build

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: lstk start

      - name: Register the extension
        run: make submit

      - name: Run tests
        run: make test

      - name: Show LocalStack logs
        if: failure()
        run: lstk logs | tail -300
